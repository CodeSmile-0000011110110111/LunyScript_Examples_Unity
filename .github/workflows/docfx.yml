name: Build and Deploy DocFX Documentation

on:
  push:
    branches: ["main"]
    paths:
      - 'Packages/de.codesmile.lunyscript/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build Documentation
        run: |
          cd Packages/de.codesmile.lunyscript/Documentation~
          docfx build docfx.json

      - name: Deploy to RFC repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.RFC_DEPLOY_KEY }}
          external_repository: CodeSmile-0000011110110111/LunyScript-RFC
          publish_branch: main
          publish_dir: ./docfx-output
          destination_dir: manual
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy DocFX documentation'
